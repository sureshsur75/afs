input {
  tcp {
    #port => 6515
    port => 6514
   
  }
}



filter {
mutate {
  gsub => [
    "message", '^"', "",
    "message", '"$', ""
  ]
}
if [message] =~ /\tMSWinEventLog\t/ {
  ruby {
    code => '
      fields = event.get("message").split("\t", 16)

      if fields.length == 16
        event.set("[host][name]", fields[0])
        event.set("[snare][log_type]", fields[1])
        event.set("[snare][priority]", fields[2])
        event.set("[snare][log_name]", fields[3])
        event.set("[snare][record_id]", fields[4])
        event.set("[snare][event_time]", fields[5])
        event.set("[event][code]", fields[6])
        event.set("[snare][event_source]", fields[7])
        event.set("[snare][user]", fields[8])
        event.set("[snare][sid]", fields[9])
        event.set("[snare][audit_result]", fields[10])
        event.set("[snare][device_name]", fields[11])
        event.set("[snare][category]", fields[12])
        # fields[13] is intentionally blank
        event.set("[snare][message]", fields[14])
        event.set("[snare][event_serial]", fields[15])
      else
        event.tag("_ruby_split_failure")
      end
    '
  }
}

  if [event][code] == "4103" {

    grok {
      match => {
        "[snare][message]" => 'CommandInvocation\(%{DATA:command_invocation}\):\s+""%{DATA}""\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}ParameterBinding\(%{DATA:parameter_binding}\):\s+name=""%{DATA:param_name}"";\s+value=""%{DATA:param_value}""\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Severity\s+=\s+%{DATA:severity}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Host Name\s+=\s+%{DATA:host_name}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Host Version\s+=\s+%{DATA:host_version}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Host ID\s+=\s+%{DATA:host_id}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Host Application\s+=\s+%{DATA:host_application}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Engine Version\s+=\s+%{DATA:engine_version}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Runspace ID\s+=\s+%{DATA:runspace_id}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Pipeline ID\s+=\s+%{DATA:pipeline_id}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Command Name\s+=\s+%{DATA:command_name}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Command Type\s+=\s+%{DATA:command_type}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Script Name\s+=\s+%{DATA:script_name}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Command Path\s+=\s+%{DATA:command_path}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Sequence Number\s+=\s+%{DATA:sequence_number}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}User\s+=\s+%{DATA:user}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Connected User\s+=\s+%{DATA:connected_user}\s{2,}'
      }
    }

    grok {
      match => {
        "[snare][message]" => '%{DATA}Shell ID\s+=\s+%{DATA:shell_id}\s{2,}'
      }
    }

  }



else if [event][code] == "4624" {
 
grok {
  match => {
    "message" => "Subject:\s*Security ID:\s*%{NOTSPACE:winlog.subject.security_id}\s*Account Name:\s*%{NOTSPACE:winlog.subject.account_name}\s*Account Domain:\s*%{NOTSPACE:winlog.subject.account_domain}\s*Logon ID:\s*%{NOTSPACE:winlog.subject.logon_id}\s*Logon Information:\s*Logon Type:\s*%{INT:winlog.logon_type}\s*Restricted Admin Mode:\s*%{NOTSPACE:winlog.restricted_admin}\s*Virtual Account:\s*%{NOTSPACE:winlog.virtual_account}\s*Elevated Token:\s*%{NOTSPACE:winlog.elevated_token}\s*Impersonation Level:\s*%{NOTSPACE:winlog.impersonation_level}\s*New Logon:\s*Security ID:\s*%{NOTSPACE:winlog.newlogon.security_id}\s*Account Name:\s*%{NOTSPACE:winlog.newlogon.account_name}\s*Account Domain:\s*%{NOTSPACE:winlog.newlogon.account_domain}\s*Logon ID:\s*%{NOTSPACE:winlog.newlogon.logon_id}\s*Linked Logon ID:\s*%{NOTSPACE:winlog.newlogon.linked_logon_id}\s*Network Account Name:\s*%{NOTSPACE:winlog.newlogon.network_account_name}\s*Network Account Domain:\s*%{NOTSPACE:winlog.newlogon.network_account_domain}\s*Logon GUID:\s*%{NOTSPACE:winlog.newlogon.logon_guid}\s*Process Information:\s*Process ID:\s*%{NOTSPACE:winlog.process.id}\s*Process Name:\s*%{NOTSPACE:winlog.process.name}\s*Network Information:\s*Workstation Name:\s*%{NOTSPACE:winlog.network.workstation}\s*Source Network Address:\s*%{NOTSPACE:winlog.network.source_address}\s*Source Port:\s*%{NOTSPACE:winlog.network.source_port}\s*Detailed Authentication Information:\s*Logon Process:\s*%{NOTSPACE:winlog.auth.logon_process}\s*Authentication Package:\s*%{NOTSPACE:winlog.auth.package}\s*Transited Services:\s*%{NOTSPACE:winlog.auth.transited_services}\s*Package Name \(NTLM only\):\s*%{NOTSPACE:winlog.auth.package_name}\s*Key Length:\s*%{INT:winlog.auth.key_length}\s*%{GREEDYDATA:winlog.description}"
  }
}
mutate {
 convert => {
   "[winlog][network][source_port]" => "integer"
   "[winlog][auth][key_length]" => "integer"
 }
}

 }





else if [event][code] == "4625" {
  grok {
    match => {
      "[snare][message]" => ".*Subject:\s*Security ID:\s*%{DATA:winlog.subject.security_id}\s*Account Name:\s*%{DATA:winlog.subject.account_name}\s*Account Domain:\s*%{DATA:winlog.subject.account_domain}\s*Logon ID:\s*%{DATA:winlog.subject.logon_id}\s*Logon Type:\s*%{INT:winlog.logon_type}\s*Account For Which Logon Failed:\s*Security ID:\s*%{DATA:winlog.target.security_id}\s*Account Name:\s*%{DATA:winlog.target.account_name}\s*Account Domain:\s*%{DATA:winlog.target.account_domain}\s*Failure Information:\s*Failure Reason:\s*%{DATA:winlog.failure.reason}\s*Status:\s*%{DATA:winlog.failure.status}\s*Sub Status:\s*%{DATA:winlog.failure.sub_status}\s*Process Information:\s*Caller Process ID:\s*%{DATA:winlog.process.caller_process_id}\s*Caller Process Name:\s*%{DATA:winlog.process.caller_process_name}\s*Network Information:\s*Workstation Name:\s*%{DATA:winlog.network.workstation}\s*Source Network Address:\s*%{DATA:winlog.network.source_address}\s*Source Port:\s*%{DATA:winlog.network.source_port}\s*Detailed Authentication Information:\s*Logon Process:\s*%{DATA:winlog.auth.logon_process}\s*Authentication Package:\s*%{DATA:winlog.auth.package}\s*Transited Services:\s*%{DATA:winlog.auth.transited_services}\s*Package Name \(NTLM only\):\s*%{DATA:winlog.auth.package_name}\s*Key Length:\s*%{DATA:winlog.auth.key_length}\s+"
    }
  }
}



else if [event][code] == "4688" {
  grok {
    match => {
      "[snare][message]" => "Creator Subject:\s*Security ID:\s*%{DATA:winlog.creator.security_id}\s*Account Name:\s*%{DATA:winlog.creator.account_name}\s*Account Domain:\s*%{DATA:winlog.creator.account_domain}\s*Logon ID:\s*%{DATA:winlog.creator.logon_id}\s*Target Subject:\s*Security ID:\s*%{DATA:winlog.target.security_id}\s*Account Name:\s*%{DATA:winlog.target.account_name}\s*Account Domain:\s*%{DATA:winlog.target.account_domain}\s*Logon ID:\s*%{DATA:winlog.target.logon_id}\s*Process Information:\s*New Process ID:\s*%{DATA:winlog.process.new_process_id}\s*New Process Name:\s*%{DATA:winlog.process.new_process_name}\s*Token Elevation Type:\s*%{DATA:winlog.process.token_elevation_type}\s*Mandatory Label:\s*%{DATA:winlog.process.mandatory_label}\s*Creator Process ID:\s*%{DATA:winlog.process.creator_process_id}\s*Creator Process Name:\s*%{DATA:winlog.process.creator_process_name}\s*Process Command Line:\s*(?<winlog.process.command_line>.*?)\s+Token Elevation Type indicates"
    }
  }
}




else if [event][code] == "4740" {
  grok {
    match => {
      "[snare][message]" => "A user account was locked out\.\s*Subject:\s*Security ID:\s*%{DATA:winlog.subject.security_id}\s*Account Name:\s*%{DATA:winlog.subject.account_name}\s*Account Domain:\s*%{DATA:winlog.subject.account_domain}\s*Logon ID:\s*%{DATA:winlog.subject.logon_id}\s*Account That Was Locked Out:\s*Security ID:\s*%{DATA:winlog.target.security_id}\s*Account Name:\s*%{DATA:winlog.target.account_name}\s*Additional Information:\s*Caller Computer Name:\s*%{DATA:winlog.caller.computer_name}"
    }
  }
}






else if [event][code] == "4702" {

  grok {
    match => {
      "[snare][message]" =>
        "^%{DATA:[winlog][message]}\s+Subject:\s+Security ID:\s+%{DATA:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][newlogon][account_name]}\s+Account Domain:\s+%{DATA:[winlog][newlogon][account_domain]}\s+Logon ID:\s+%{DATA:[winlog][subject][logon_id]}\s+Task Information:\s+Task Name:\s+%{DATA:[winlog][task][name]}\s+Task New Content:\s+%{GREEDYDATA:tmp_xml}\s+Other Information:\s+ProcessCreationTime:\s+%{DATA:[winlog][process_creation_time]}\s+ClientProcessId:\s+%{DATA:[winlog][client_process_id]}\s+ParentProcessId:\s+%{DATA:[winlog][parent_process_id]}(\s+FQDN:\s+%{GREEDYDATA})?$"
    }
    tag_on_failure => ["_4702_grok_failure"]
  }

  mutate {
    rename => {
      "tmp_xml" => "[winlog][task][xml]"
    }
  }

}






else if [event][code] == "4673" {
  grok {
    match => {
      "[snare][message]" => [
"A privileged service was called\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][event_data][subject_user_sid]}\s+Account Name:\s+%{DATA:[winlog][event_data][subject_user_name]}\s+Account Domain:\s+%{DATA:[winlog][event_data][subject_domain_name]}\s+Logon ID:\s+%{NOTSPACE:[winlog][event_data][subject_logon_id]}\s+Service:\s+Server:\s+%{DATA:[winlog][event_data][service_server]}\s+Service Name:\s+%{DATA:[winlog][event_data][service_name]}\s+Process:\s+Process ID:\s+%{NOTSPACE:[process][pid]}\s+Process Name:\s+%{DATA:[process][name]}\s+Service Request Information:\s+Privileges:\s+%{DATA:[winlog][event_data][privileges]}"
      ]
    }
    tag_on_failure => ["grok_4673_failed"]
  }





grok {
  match => {
    "[snare][message]" => "Privileges:\s+%{WORD:[winlog][event_data][privileges]}"
  }
  tag_on_failure => ["privilege_failed"]
}

}





else if [event][code] == "4627" {
  grok {
    match => {
      "[snare][message]" => [
        "%{DATA:[winlog][message]}\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Logon Type:\s+%{INT:[winlog][logon_type]}\s+New Logon:\s+Security ID:\s+%{NOTSPACE:[winlog][target][security_id]}\s+Account Name:\s+%{DATA:[winlog][target][account_name]}\s+Account Domain:\s+%{DATA:[winlog][target][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][target][logon_id]}\s+Event in sequence:\s+%{INT:[winlog][event][sequence_number]}\s+of\s+%{INT:[winlog][event][sequence_total]}\s+Group Membership:\s+(?<winlog.group_membership>.*?)\s+The subject fields indicate"
      ]
    }
    tag_on_failure => ["grok_4627_failed"]
  }
}






else if [event][code] == "4634" {
  grok {
    match => {
      "[snare][message]" => [
        "%{DATA:[winlog][message]}\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Logon Type:\s+%{INT:[winlog][logon_type]}\s+This event is generated"
      ]
    }
    tag_on_failure => ["grok_4634_failed"]
  }
}




else if [event][code] == "4672" {
  grok {
    match => {
      "[snare][message]" => [
        "%{DATA:[winlog][message]}\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Privileges:\s+%{GREEDYDATA:[winlog][privileges]}"
      ]
    }
    tag_on_failure => ["grok_4672_failed"]
  }




ruby {
  code => '
    p = event.get("[winlog][privileges]")
    if p
      event.set("[winlog][privileges]", p.scan(/\S+/))
    end
  '
}

}




else if [event][code] == "4690" {
  grok {
    match => {
      "[snare][message]" => [
        "An attempt was made to duplicate a handle to an object\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Source Handle Information:\s+Source Handle ID:\s+%{NOTSPACE:[winlog][source_handle][id]}\s+Source Process ID:\s+%{NOTSPACE:[winlog][source_handle][process_id]}\s+New Handle Information:\s+Target Handle ID:\s+%{NOTSPACE:[winlog][target_handle][id]}\s+Target Process ID:\s+%{NOTSPACE:[winlog][target_handle][process_id]}"
      ]
    }
    tag_on_failure => ["grok_4690_failed"]
  }

  mutate {
    add_field => {
      "[winlog][message]" => "An attempt was made to duplicate a handle to an object"
    }
  }
}



else if [event][code] == "4674" {
  grok {
    match => {
      "[snare][message]" => [
        "An operation was attempted on a privileged object\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Object:\s+Object Server:\s+%{DATA:[winlog][object][server]}\s+Object Type:\s+%{DATA:[winlog][object][type]}\s+Object Name:\s+%{DATA:[winlog][object][name]}\s+Object Handle:\s+%{NOTSPACE:[winlog][object][handle]}\s+Process Information:\s+Process ID:\s+%{NOTSPACE:[winlog][process][id]}\s+Process Name:\s+%{DATA:[winlog][process][name]}\s+Requested Operation:\s+Desired Access:\s+%{NUMBER:[winlog][object][desired_access]}\s+Privileges:\s+%{GREEDYDATA:[winlog][privileges]}"
      ]
    }
    tag_on_failure => ["grok_4674_failed"]
  }

  mutate {
    add_field => {
      "[winlog][message]" => "An operation was attempted on a privileged object"
    }
  }

  if [winlog][privileges] {
    mutate {
      split => {
        "[winlog][privileges]" => "     "
      }
      strip => ["[winlog][privileges]"]
    }
  }


}



else if [event][code] == "4104" {

  grok {
    match => {
      "[snare][message]" => [
        "Creating Scriptblock text \(%{NUMBER:[winlog][event][sequence_number]} of %{NUMBER:[winlog][event][sequence_total]}\):\s*%{GREEDYDATA:scriptblock_tmp}"
      ]
    }
    tag_on_failure => ["grok_4104_failed"]
  }

  grok {
    match => {
      "scriptblock_tmp" => [
        "(?m)%{GREEDYDATA:[winlog][script_block][text]}\s+ScriptBlock ID:\s*%{NOTSPACE:[winlog][script_block][id]}\s+Path:\s*%{GREEDYDATA:[winlog][script_block][path]}"
      ]
    }
    remove_field => ["scriptblock_tmp"]
  }

  mutate {
    replace => {
      "[winlog][message]" => "Creating Scriptblock text"
    }
  }

}










else if [event][code] == "4698" {
  grok {
    match => {
      "[snare][message]" => [
        "A scheduled task was created\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Task Information:\s+Task Name:\s+%{DATA:[winlog][task][name]}\s+Task Content:\s*%{GREEDYDATA:task_content_tmp}"
      ]
    }
    tag_on_failure => ["grok_4698_failed"]
  }
  grok {
    match => {
      "task_content_tmp" => [
        "(?m)%{GREEDYDATA:[winlog][task][content]}\s+Other Information:\s+ProcessCreationTime:\s+%{NOTSPACE:[winlog][process_creation_time]}\s+ClientProcessId:\s+%{NUMBER:[winlog][client_process_id]}\s+ParentProcessId:\s+%{NUMBER:[winlog][parent_process_id]}\s+FQDN:\s+%{NOTSPACE:[winlog][fqdn]}"
      ]
    }
    remove_field => ["task_content_tmp"]
  }
  mutate {
    replace => {
      "[winlog][message]" => "A scheduled task was created"
    }
  }
}




if [event][code] == "4648" {

  grok {
    tag_on_failure => ["grok_4648_failed"]

    match => {
      "[snare][message]" => [
"Subject:\s+Security ID:\s+%{DATA:winlog.subject.security_id}\s+Account Name:\s+%{DATA:winlog.subject.account_name}\s+Account Domain:\s+%{DATA:winlog.subject.account_domain}\s+Logon ID:\s+%{DATA:winlog.subject.logon_id}\s+Logon GUID:\s+%{DATA:winlog.subject.logon_guid}\s+Account Whose Credentials Were Used:\s+Account Name:\s+%{DATA:winlog.target.account_name}\s+Account Domain:\s+%{DATA:winlog.target.account_domain}\s+Logon GUID:\s+%{DATA:winlog.target.logon_guid}\s+Target Server:\s+Target Server Name:\s+%{DATA:winlog.target.server_name}\s+Additional Information:\s+%{DATA:winlog.target.additional_info}\s+Process Information:\s+Process ID:\s+%{DATA:winlog.process.id}\s+Process Name:\s+%{DATA:winlog.process.name}\s+Network Information:\s+Network Address:\s+%{IP:winlog.network.source_address}\s+Port:\s+%{INT:winlog.network.source_port}"
      ]
    }
  }

}




else if [event][code] == "4738" {
  grok {
    match => {
      "[snare][message]" => [
        "A user account was changed\.\s+Subject:\s+Security ID:\s+%{NOTSPACE:[winlog][subject][security_id]}\s+Account Name:\s+%{DATA:[winlog][subject][account_name]}\s+Account Domain:\s+%{DATA:[winlog][subject][account_domain]}\s+Logon ID:\s+%{NOTSPACE:[winlog][subject][logon_id]}\s+Target Account:\s+Security ID:\s+%{NOTSPACE:[winlog][target][security_id]}\s+Account Name:\s+%{DATA:[winlog][target][account_name]}\s+Account Domain:\s+%{DATA:[winlog][target][account_domain]}\s+Changed Attributes:\s*%{GREEDYDATA:changed_attrs_tmp}"
      ]
    }
    tag_on_failure => ["grok_4738_failed"]
  }
  grok {
    match => {
      "changed_attrs_tmp" => [
        "SAM Account Name:\s+%{DATA:[winlog][event_data][sam_account_name]}\s+Display Name:\s+%{DATA:[winlog][event_data][display_name]}\s+User Principal Name:\s+%{DATA:[winlog][event_data][user_principal_name]}\s+Home Directory:\s+%{DATA:[winlog][event_data][home_directory]}\s+Home Drive:\s+%{DATA:[winlog][event_data][home_drive]}\s+Script Path:\s+%{DATA:[winlog][event_data][script_path]}\s+Profile Path:\s+%{DATA:[winlog][event_data][profile_path]}\s+User Workstations:\s+%{DATA:[winlog][event_data][user_workstations]}\s+Password Last Set:\s+%{DATA:[winlog][event_data][password_last_set]}\s+Account Expires:\s+%{DATA:[winlog][event_data][account_expires]}\s+Primary Group ID:\s+%{DATA:[winlog][event_data][primary_group_id]}\s+AllowedToDelegateTo:\s+%{DATA:[winlog][event_data][allowed_to_delegate_to]}\s+Old UAC Value:\s+%{NOTSPACE:[winlog][event_data][old_uac_value]}\s+New UAC Value:\s+%{NOTSPACE:[winlog][event_data][new_uac_value]}\s+User Account Control:\s*%{DATA:[winlog][event_data][user_account_control]}\s+User Parameters:\s+%{DATA:[winlog][event_data][user_parameters]}\s+SID History:\s+%{DATA:[winlog][event_data][sid_history]}\s+Logon Hours:\s+%{DATA:[winlog][event_data][logon_hours]}\s+Additional Information:\s+Privileges:\s+%{GREEDYDATA:[winlog][privileges]}"
      ]
    }
    remove_field => ["changed_attrs_tmp"]
  }
  mutate {
    replace => {
      "[winlog][message]" => "A user account was changed"
    }
  }
}





else if [message] =~ "\tLinuxKAudit\t" {

  grok {
    match => {
      "message" => "^%{DATA:audit_host}\t%{DATA:audit_app}\t%{DATA:severity}\t%{DATA:event_kv}\t%{DATA:seq_kv}\t%{DATA:uid_kv}\t%{DATA:euid_kv}\t%{DATA:gid_kv}\t%{DATA:egid_kv}\t%{DATA:process_kv}\t%{DATA:return_kv}\t%{DATA:name_kv}\t%{GREEDYDATA:audit_rest}"
    }
    tag_on_failure => ["_grokparsefailure_linuxkaudit_header"]
  }

  # ---- decode each tab-delimited kv field ----
  if [event_kv] {
    grok { match => { "event_kv" => "event,%{DATA:audit_type},%{GREEDYDATA:audit_time}" } }
  }
  if [seq_kv] {
    grok { match => { "seq_kv" => "sequence,%{INT:sequence}" } }
  }
  if [uid_kv] {
    grok { match => { "uid_kv" => "uid,%{INT:uid},%{GREEDYDATA:uid_name}" } }
  }
  if [euid_kv] {
    grok { match => { "euid_kv" => "euid,%{INT:euid},%{GREEDYDATA:euid_name}" } }
  }
  if [gid_kv] {
    grok { match => { "gid_kv" => "gid,%{INT:gid},%{GREEDYDATA:gid_name}" } }
  }
  if [egid_kv] {
    grok { match => { "egid_kv" => "egid,%{INT:egid},%{GREEDYDATA:egid_name}" } }
  }
  if [process_kv] {
    grok { match => { "process_kv" => "process,,?%{GREEDYDATA:process_path}" } }
  }
  if [return_kv] {
    grok { match => { "return_kv" => "return,%{INT:return_code},%{GREEDYDATA:return_status}" } }
  }

  # ---- pull fields straight out of the audit trailer (audit_rest) ----
  # each is searched independently against the same blob - \b guards
  # against short keys matching inside longer ones (pid vs ppid, etc.)
  if [audit_rest] {
    grok {
      break_on_match => false
      match => {
        "audit_rest" => [
          "exe,%{NOTSPACE:exe}",
          "success,%{WORD:success}",
          "syscall,%{INT:syscall_num},%{WORD:syscall_name}",
          "return,%{INT:return_code2}",
          "arch,%{NOTSPACE:arch}",
          "\ba0,%{NOTSPACE:a0}",
          "\ba1,%{NOTSPACE:a1}",
          "\ba2,%{NOTSPACE:a2}",
          "\ba3,%{NOTSPACE:a3}",
          "items,%{INT:items}",
          "\bppid,%{INT:ppid}",
          "\bpid,%{INT:pid}",
          "\bsuid,%{INT:suid}",
          "\bfsuid,%{INT:fsuid}",
          "\bsgid,%{INT:sgid}",
          "\bfsgid,%{INT:fsgid}",
          "tty,%{NOTSPACE:tty}",
          "ses,%{NOTSPACE:ses}",
          "comm,%{NOTSPACE:comm}",
          "key,%{NOTSPACE:audit_key}"
        ]
      }
      tag_on_failure => []
    }

    if "type,CWD" in [audit_rest] {
      grok {
        match => { "audit_rest" => ".*type,CWD cwd,%{DATA:cwd} node,%{DATA:cwd_node} type,PATH.*" }
      }
    }

    if "type,PATH" in [audit_rest] {
      grok {
        match => {
          "audit_rest" => "type,PATH item,%{INT:item} inode,%{INT:inode} dev,%{NOTSPACE:dev} mode,%{NOTSPACE:mode} ouid,%{INT:ouid} ogid,%{INT:ogid} rdev,%{NOTSPACE:rdev} nametype,%{WORD:nametype}"
        }
      }
    }

    if "type,PROCTITLE" in [audit_rest] {
      grok {
        match => {
          "audit_rest" => "proctitle,%{NOTSPACE:proctitle}\tsnareseq,%{INT:snareseq}"
        }
      }
    }
  }
}




